---
name: securefix
on:
  workflow_run:
    workflows: ["test"]
    types:
      - completed
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: securefix
          run-id: ${{ github.event.workflow_run.id }}
      - run: cat file.txt
      - env:
          GH_TOKEN: ${{github.token}}
        run: |
          while read -r line; do
            echo "line: $line" >&2
            if [ -z "$line" ]; then
              continue
            fi
            op=$(echo "$line" | jq -r '.op')
            echo "op: $op" >&2
            if [ "$op" = "update_branch" ]; then
              pr=$(echo "$line" | jq -r '.pr')
              echo "pr: $pr" >&2
              if [ -z "$pr" ]; then
                echo "::error:: pr is required"
                continue
              fi
              echo "::notice:: update branch: $pr"
              gh pr -R "$GITHUB_REPOSITORY" update-branch "$pr"
            elif [ "$op" = "add_label" ]; then
              pr=$(echo "$line" | jq -r '.pr')
              echo "pr: $pr" >&2
              if [ -z "$pr" ]; then
                echo "::error:: pr is required"
                continue
              fi
              label=$(echo "$line" | jq -r '.label')
              echo "label: $label" >&2
              if [ -z "$label" ]; then
                echo "::error:: label is required"
                continue
              fi
              echo "::notice:: add a label: pr=$pr label=$label"
              gh pr -R "$GITHUB_REPOSITORY" edit --add-label "$label" "$pr"
            elif [ -z "$op"]; then
              echo "::error:: op is required"
              continue
            else
              echo "::error:: unsupported op: $op"
              continue
            fi
          done < file.txt


